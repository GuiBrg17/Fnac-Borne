<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeanne — Borne d'accueil Fnac</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="grid-floor"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="kiosk">

  <header class="kiosk-header">
    <div class="brand">
      <span class="brand-mark">fnac</span>
      <span class="brand-sep">×</span>
      <span class="brand-name">Jeanne</span>
    </div>
    <div class="store-name">Fnac Jeanne d'Arc — Toulouse</div>
    
    <div id="langFlags" style="display: flex; gap: 15px; margin-left: auto;">
      <span class="flag-btn active" data-lang="fr" style="cursor: pointer; font-size: 28px;">🇫🇷</span>
      <span class="flag-btn" data-lang="en" style="cursor: pointer; font-size: 28px; filter: grayscale(100%);">🇬🇧</span>
      <span class="flag-btn" data-lang="es" style="cursor: pointer; font-size: 28px; filter: grayscale(100%);">🇪🇸</span>
    </div>
  </header>

  <main class="stage">

    <section class="avatar-panel floaty">
      <div class="avatar-frame">
        <canvas id="avatarCanvas"></canvas>
        <div class="listening-ring" id="listeningRing"></div>
      </div>

      <div class="avatar-caption" id="avatarCaption">Bonjour, je m'appelle Jeanne. Parlez-moi, ou écrivez votre question.</div>

      <button class="mic-btn-main" id="micBtn" title="Parler">
        <span class="mic-icon">🎙️</span>
        <span id="micLabel">Parler à Jeanne</span>
      </button>

      <details class="text-fallback">
        <summary>Écrire plutôt que parler</summary>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" placeholder="Ex : où sont les disques durs ?" autocomplete="off">
          <button type="submit">Envoyer</button>
        </form>
      </details>
    </section>

    <section class="interaction-panel floaty">

      <div class="chat-log" id="chatLog"></div>

      <div class="quick-actions">
        <button class="quick-btn" data-q="Où est l'espace Apple ?">🍏 Apple</button>
        <button class="quick-btn" data-q="Je cherche un écran de PC Gaming">💻 PC Gaming</button>
        <button class="quick-btn" data-q="Je voudrais un nouveau smartphone">📱 Téléphonie</button>
        <button class="quick-btn" data-q="Où sont les jeux vidéo ?">🎮 Jeux Vidéo</button>
        <button class="quick-btn" data-q="Where can I find a hard drive?">🌍 Ask in English</button>
        <button class="quick-btn" data-q="¿Dónde puedo pagar?">🌍 Preguntar en español</button>
      </div>

      <button class="vendor-btn" id="vendorBtn">🙋 Être accompagné par un vendeur</button>

    </section>

    <section class="map-panel floaty">
      <div class="map-title">Plan du magasin — Rez-de-chaussée & Sous-sol</div>
      <canvas id="mapCanvas"></canvas>
    </section>

  </main>

  <div class="toast" id="toast"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="script.js"></script>
</body>
</html>
