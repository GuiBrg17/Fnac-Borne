<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeanne — Borne d'accueil Fnac</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="kiosk">

  <header class="kiosk-header">
    <div class="brand">
      <span class="brand-mark">fnac</span>
      <span class="brand-sep">×</span>
      <span class="brand-name">Jeanne</span>
    </div>
    <div class="store-name">Fnac Jeanne d'Arc — Toulouse</div>
  </header>

  <main class="stage">

    <section class="avatar-panel">
      <div class="avatar-frame">
        <canvas id="avatarCanvas"></canvas>
        <div class="listening-ring" id="listeningRing"></div>
      </div>

      <div class="avatar-caption" id="avatarCaption">Bonjour, je m'appelle Jeanne. Parlez-moi, ou écrivez votre question.</div>

      <button class="mic-btn-main" id="micBtn" title="Parler">
        <span class="mic-icon">🎙️</span>
        <span id="micLabel">Parler à Jeanne</span>
      </button>

      <div class="lang-switch">
        <span class="lang-label">Langue de la voix</span>
        <div class="lang-options" id="langOptions">
          <button class="lang-btn active" data-lang="fr-FR">FR</button>
          <button class="lang-btn" data-lang="en-US">EN</button>
          <button class="lang-btn" data-lang="es-ES">ES</button>
        </div>
      </div>

      <details class="text-fallback">
        <summary>Écrire plutôt que parler</summary>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" placeholder="Ex : où sont les disques durs ?" autocomplete="off">
          <button type="submit">Envoyer</button>
        </form>
      </details>
    </section>

    <section class="interaction-panel">

      <div class="chat-log" id="chatLog"></div>

      <div class="quick-actions">
        <button class="quick-btn" data-q="Où puis-je trouver un disque dur ?">📀 Disques durs</button>
        <button class="quick-btn" data-q="Je cherche un casque audio">🎧 Casques audio</button>
        <button class="quick-btn" data-q="Avez-vous des consoles de jeu ?">🎮 Consoles</button>
        <button class="quick-btn" data-q="Je voudrais un livre">📚 Livres</button>
        <button class="quick-btn" data-q="Where can I find a hard drive?">🌍 Ask in English</button>
        <button class="quick-btn" data-q="¿Dónde puedo encontrar auriculares?">🌍 Preguntar en español</button>
      </div>

      <button class="vendor-btn" id="vendorBtn">🙋 Être accompagné par un vendeur</button>

    </section>

    <section class="map-panel">
      <div class="map-title">Plan du magasin — Rez-de-chaussée</div>
      <canvas id="mapCanvas"></canvas>
    </section>

  </main>

  <div class="toast" id="toast"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
